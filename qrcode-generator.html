<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR y Tickets – Aseguradora General</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --ag-red: #E30613; --ag-red-dark: #C10510; }
        .bg-ag-red { background-color: var(--ag-red); }
        .hover\:bg-ag-red:hover { background-color: var(--ag-red-dark); }
        .text-ag-red { color: var(--ag-red); }
        .border-ag-red { border-color: var(--ag-red); }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <header class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-center">
            <img src="https://www.aseguradorageneral.com/hs-fs/hubfs/aseguradora/icon_logo_2.png?width=220&name=icon_logo_2.png"
                 alt="Aseguradora General" style="height: 44px; width: auto;">
        </div>
        <div class="bg-ag-red text-white text-center py-1.5 text-xs font-medium tracking-wide">
            Generador de Códigos QR y Tickets de Acceso
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-6">

        <div class="bg-red-50 border border-red-100 rounded-xl p-4 mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div>
                <p class="font-semibold text-gray-900 text-sm">Archivo de ejemplo con 100 invitados</p>
                <p class="text-xs text-gray-600 mt-0.5">Descárgalo para probar y luego súbelo aquí</p>
            </div>
            <button id="downloadExampleBtn" class="bg-ag-red hover:bg-ag-red text-white text-sm font-medium py-2 px-4 rounded-lg whitespace-nowrap shadow-sm">
                📥 Descargar CSV de ejemplo
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4">1. Subir archivo CSV</h2>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-red-400 transition-colors">
                <input type="file" id="csvFile" accept=".csv" class="hidden">
                <label for="csvFile" class="cursor-pointer">
                    <div class="text-4xl mb-3">📄</div>
                    <p class="text-gray-600 font-medium">Haz clic o arrastra el archivo CSV aquí</p>
                    <p class="text-xs text-gray-400 mt-2">Formato: guest_number,name</p>
                </label>
            </div>
            <div id="fileInfo" class="mt-4 text-sm text-gray-600 hidden">
                <span class="font-semibold">Archivo:</span> <span id="fileName"></span>
                <span class="ml-4 font-semibold">Filas:</span> <span id="rowCount">0</span>
            </div>
        </div>

        <div id="previewSection" class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100 hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-4">2. Elegir tipo de salida</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <label class="flex items-center gap-3 p-4 border-2 rounded-xl cursor-pointer hover:border-red-300 transition-colors border-gray-200 has-[:checked]:border-ag-red has-[:checked]:bg-red-50">
                    <input type="radio" name="outputType" value="qr" class="w-5 h-5 accent-red-600" checked>
                    <div>
                        <div class="font-semibold text-gray-800">Solo códigos QR</div>
                        <div class="text-xs text-gray-500">ZIP con archivos PNG</div>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-4 border-2 rounded-xl cursor-pointer hover:border-red-300 transition-colors border-gray-200 has-[:checked]:border-ag-red has-[:checked]:bg-red-50">
                    <input type="radio" name="outputType" value="ticket" class="w-5 h-5 accent-red-600">
                    <div>
                        <div class="font-semibold text-gray-800">Tickets de Acceso</div>
                        <div class="text-xs text-gray-500">ZIP con PDFs listos para imprimir</div>
                    </div>
                </label>
            </div>
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                <div id="status" class="text-sm text-gray-500"></div>
                <button id="downloadBtn" class="bg-ag-red hover:bg-ag-red text-white font-bold py-2.5 px-6 rounded-xl shadow transition-all disabled:opacity-50 disabled:cursor-not-allowed w-full sm:w-auto">
                    📦 Descargar ZIP
                </button>
            </div>
            <div id="previewGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>

        <div id="progressBox" class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 hidden">
            <h3 class="font-bold text-gray-800 mb-2">Generando archivos...</h3>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progressBar" class="bg-ag-red h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm text-gray-500 mt-2">0 / 0</p>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 text-center py-4 text-xs text-gray-500">
        © 2026 Aseguradora General, S.A. · Guatemala
    </footer>

    <script>
        const EXAMPLE_CSV = `guest_number,name

AG-10088,Catalina Salazar

AG-10090,Amparo Aguilar
AG-10091,Ignacio Morales
AG-10092,Esperanza Reyes
AG-10093,Salvador Castillo
AG-10094,Consuelo Jiménez
AG-10095,Ramiro Torres
AG-10096,Dolores López
AG-10097,Fabián Hernández
AG-10098,Pilar García
AG-10099,Mateo Martínez
AG-10100,Regina Rodríguez`;

        document.getElementById('downloadExampleBtn').addEventListener('click', () => {
            saveAs(new Blob([EXAMPLE_CSV], { type: 'text/csv;charset=utf-8;' }), 'Ejemplo_100_Invitados.csv');
        });

        let guests = [];
        const csvFileInput = document.getElementById('csvFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameEl = document.getElementById('fileName');
        const rowCountEl = document.getElementById('rowCount');
        const previewSection = document.getElementById('previewSection');
        const previewGrid = document.getElementById('previewGrid');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusEl = document.getElementById('status');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        // Logo como imagen para los PDFs
        let logoDataUrl = null;
        (async () => {
            try {
                const resp = await fetch('https://www.aseguradorageneral.com/hs-fs/hubfs/aseguradora/icon_logo_2.png?width=434&name=icon_logo_2.png');
                const blob = await resp.blob();
                const reader = new FileReader();
                reader.onload = () => { logoDataUrl = reader.result; };
                reader.readAsDataURL(blob);
            } catch(e) { console.warn('No se pudo cargar el logo', e); }
        })();

        csvFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            fileNameEl.textContent = file.name;
            fileInfo.classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = e => parseCSV(e.target.result);
            reader.readAsText(file);
        });

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            guests = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const guest_number = parts[0].trim();
                    const name = parts.slice(1).join(',').trim();
                    if (guest_number) guests.push({ guest_number, name });
                }
            }
            rowCountEl.textContent = guests.length;
            previewSection.classList.remove('hidden');
            previewGrid.innerHTML = '';
            const previewCount = Math.min(8, guests.length);
            for (let i = 0; i < previewCount; i++) createQRPreview(guests[i]);
            if (guests.length > 8) {
                const more = document.createElement('div');
                more.className = 'col-span-full text-center text-sm text-gray-500 py-2';
                more.textContent = `… y ${guests.length - 8} más`;
                previewGrid.appendChild(more);
            }
            downloadBtn.disabled = false;
            statusEl.textContent = `${guests.length} invitados cargados.`;
        }

        function createQRPreview(guest) {
            const card = document.createElement('div');
            card.className = 'bg-gray-50 rounded-xl p-3 text-center border border-gray-200';
            const canvas = document.createElement('canvas');
            card.appendChild(canvas);
            new QRious({ element: canvas, value: guest.guest_number, size: 100, foreground: '#000000', background: '#ffffff', level: 'M', padding: 10 });
            const label = document.createElement('p');
            label.className = 'text-xs font-mono text-gray-700 truncate mt-2';
            label.textContent = guest.guest_number;
            card.appendChild(label);
            const nameLabel = document.createElement('p');
            nameLabel.className = 'text-xs text-gray-500 truncate';
            nameLabel.textContent = guest.name;
            card.appendChild(nameLabel);
            previewGrid.appendChild(card);
        }

        function safeFilename(name) {
            return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9\-_\s]/g, '').trim().replace(/\s+/g, '_');
        }

        // ========== Ticket PDF moderno con logo ==========
        function createTicketPDF(guest) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [90, 160] });
            const pageW = 90, pageH = 160;

            // Fondo oscuro moderno
            pdf.setFillColor(18, 18, 18);
            pdf.rect(0, 0, pageW, pageH, 'F');

            // Franja roja superior
            pdf.setFillColor(227, 6, 19);
            pdf.rect(0, 0, pageW, 8, 'F');

            // Logo oficial (si está cargado)
            if (logoDataUrl) {
                try {
                    pdf.addImage(logoDataUrl, 'PNG', 15, 14, 60, 15.5);
                } catch(e) {
                    pdf.setTextColor(255,255,255);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(11);
                    pdf.text('ASEGURADORA GENERAL', pageW/2, 22, { align: 'center' });
                }
            } else {
                pdf.setTextColor(255,255,255);
                pdf.setFont('helvetica', 'bold');
                pdf.setFontSize(11);
                pdf.text('ASEGURADORA GENERAL', pageW/2, 22, { align: 'center' });
            }

            // Subtítulo
            pdf.setTextColor(200, 200, 200);
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(8);
            pdf.text('TICKET DE ACCESO', pageW/2, 36, { align: 'center' });

            // Línea decorativa
            pdf.setDrawColor(227, 6, 19);
            pdf.setLineWidth(0.6);
            pdf.line(25, 40, 65, 40);

            // Caja blanca para QR + nombre
            pdf.setFillColor(255, 255, 255);
            pdf.roundedRect(8, 48, 74, 90, 5, 5, 'F');

            // QR
            const qrCanvas = document.createElement('canvas');
            new QRious({
                element: qrCanvas,
                value: guest.guest_number,
                size: 300,
                foreground: '#111111',
                background: '#ffffff',
                level: 'H',
                padding: 16
            });
            pdf.addImage(qrCanvas.toDataURL('image/png'), 'PNG', 20, 54, 50, 50);

            // Nombre del invitado
            pdf.setTextColor(18, 18, 18);
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(12);
            const nameLines = pdf.splitTextToSize(guest.name, 64);
            const nameY = 112 + (nameLines.length > 1 ? 0 : 2);
            pdf.text(nameLines, pageW/2, nameY, { align: 'center' });

            // Número de invitado
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(8);
            pdf.setTextColor(120, 120, 120);
            pdf.text(guest.guest_number, pageW/2, 128, { align: 'center' });

            // Pie inferior rojo
            pdf.setFillColor(227, 6, 19);
            pdf.rect(0, 148, pageW, 12, 'F');
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(6.5);
            pdf.text('Aseguradora General, S.A.  ·  Guatemala', pageW/2, 155.5, { align: 'center' });

            return pdf;
        }

        downloadBtn.addEventListener('click', async function() {
            if (guests.length === 0) return;
            const outputType = document.querySelector('input[name="outputType"]:checked').value;
            downloadBtn.disabled = true;
            progressBox.classList.remove('hidden');
            statusEl.textContent = outputType === 'ticket' ? 'Generando Tickets de Acceso...' : 'Generando códigos QR...';

            const zip = new JSZip();
            const total = guests.length;
            const canvas = document.createElement('canvas');

            for (let i = 0; i < total; i++) {
                const guest = guests[i];
                const safeName = safeFilename(guest.name);

                if (outputType === 'qr') {
                    new QRious({ element: canvas, value: guest.guest_number, size: 512, foreground: '#000000', background: '#ffffff', level: 'H', padding: 40 });
                    const base64 = canvas.toDataURL('image/png').split(',')[1];
                    zip.file(`${guest.guest_number}_${safeName}.png`, base64, { base64: true });
                } else {
                    const pdf = createTicketPDF(guest);
                    zip.file(`${guest.guest_number}_${safeName}.pdf`, pdf.output('blob'));
                }

                const percent = Math.round(((i + 1) / total) * 100);
                progressBar.style.width = percent + '%';
                progressText.textContent = `${i + 1} / ${total}`;
                if (i % 5 === 0) await new Promise(r => setTimeout(r, 10));
            }

            const content = await zip.generateAsync({ type: 'blob' });
            const zipName = outputType === 'ticket'
                ? `Tickets_Acceso_Aseguradora_General_${new Date().toISOString().slice(0,10)}.zip`
                : `Codigos_QR_Aseguradora_General_${new Date().toISOString().slice(0,10)}.zip`;
            saveAs(content, zipName);

            progressBox.classList.add('hidden');
            downloadBtn.disabled = false;
            statusEl.textContent = `¡Listo! ZIP con ${total} archivos descargado.`;
        });
    </script>
</body>
</html>
