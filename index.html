<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseguradora General - Control de Acceso</title>
    <style>
        :root {
            --ag-blue: #002855;
            --ag-accent: #004b87;
        }
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--ag-blue);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 1.25rem; font-weight: bold; letter-spacing: 0.05em; }
        header p { margin: 0; font-size: 0.75rem; color: #93c5fd; }
        .badge {
            background-color: #1e3a8a;
            color: #dbeafe;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            border: 1px solid #1d4ed8;
        }
        main {
            flex-grow: 1;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        #result-card { border-top: 8px solid #d1d5db; display: none; }
        #result-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        #result-title { font-size: 1.5rem; font-weight: bold; margin: 0 0 0.25rem 0; }
        #result-msg { color: #4b5563; font-weight: 500; margin: 0 0 1rem 0; }
        #guest-info {
            background-color: #f9fafb;
            border-radius: 0.5rem;
            padding: 0.75rem;
            border: 1px solid #f3f4f6;
            text-align: left;
        }
        .info-label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin: 0; }
        #guest-name { font-size: 1.125rem; font-weight: bold; color: #1f2937; margin: 0; }
        #guest-num { font-size: 0.875rem; font-family: monospace; color: #6b7280; margin: 0.25rem 0 0 0; }
        .scanner-container {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #f3f4f6;
        }
        .scanner-header {
            background-color: #f9fafb;
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scanner-title { font-size: 0.875rem; font-weight: bold; color: #374151; }
        #reset-btn { font-size: 0.75rem; font-weight: 600; color: var(--ag-accent); background: none; border: none; cursor: pointer; }
        #reset-btn:hover { text-decoration: underline; }
        #reader { width: 100%; background-color: black; }
        .scanner-footer { background-color: #f9fafb; padding: 1rem; border-top: 1px solid #f3f4f6; text-align: center; font-size: 0.75rem; color: #9ca3af; }
        footer { text-align: center; padding: 1rem; font-size: 0.75rem; color: #9ca3af; }
    </style>
    <!-- Lokales Nachladen des QR-Scanner-Gehirns aus demselben Repository -->
    <script src="html5-qrcode.min.js"></script>
</head>
<body>

    <header>
        <div>
            <h1>ASEGURADORA GENERAL</h1>
            <p>Control de Acceso de Invitados</p>
        </div>
        <div class="badge">🟢 Sistema Activo</div>
    </header>

    <main>
        <div id="result-card" class="card">
            <div id="result-icon">📋</div>
            <h2 id="result-title">Estado</h2>
            <p id="result-msg">Escanee un código QR para comenzar.</p>
            <div id="guest-info">
                <p class="info-label">Invitado</p>
                <p id="guest-name">-</p>
                <p id="guest-num">-</p>
            </div>
        </div>

        <div class="scanner-container">
            <div class="scanner-header">
                <span class="scanner-title">Cámara de Escaneo</span>
                <button id="reset-btn" onclick="resetScannerView()">Limpiar pantalla</button>
            </div>
            
            <div id="reader" style="width: 100%;"></div>
            
            <div class="scanner-footer">
                Asegure una buena iluminación para el código QR.
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Aseguradora General, S.A. Todos los derechos reservados.
    </footer>

    <script>
        const SUPABASE_URL = "https://ihlgngbrhxlhjptxlxfp.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_vwBzzamSzpwoY-Hq4kYjNQ_ooAlwBaw";

        let html5QrcodeScanner;
        let lastResult = null;
        let isProcessing = false;

        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing || decodedText === lastResult) return;
            
            isProcessing = true;
            lastResult = decodedText;
            
            showLoadingView();

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/check_and_scan_guest`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({ target_guest_num: decodedText })
                });

                const data = await response.json();
                
                if (!data || data.length === 0 || data.status === null) {
                    showStatus('INVALID', 'Código Inválido', 'Este código QR no pertenece a la lista de invitados.', decodedText);
                } else {
                    if (data.status === 'SUCCESS') {
                        showStatus('SUCCESS', '¡Acceso Permitido!', 'Bienvenido(a) al evento.', data.guest_name, decodedText);
                    } else if (data.status === 'ALREADY_SCANNED') {
                        showStatus('ALREADY', '⚠️ Código Ya Utilizado', 'Este boleto ya ingresó anteriormente.', data.guest_name, decodedText);
                    }
                }
            } catch (error) {
                console.error("Datenbankfehler:", error);
                showStatus('ERROR', 'Error de Conexión', 'No se konnte keine Verbindung zur DB herstellen.', '-');
            } finally {
                setTimeout(() => { 
                    isProcessing = false; 
                    lastResult = null; 
                }, 3000);
            }
        }

        function showLoadingView() {
            const card = document.getElementById('result-card');
            card.style.display = 'block';
            card.style.borderTopColor = '#3b82f6';
            card.style.backgroundColor = '#ffffff';
            document.getElementById('result-icon').innerText = "⏳";
            document.getElementById('result-title').innerText = "Verificando...";
            document.getElementById('result-title').style.color = '#1f2937';
            document.getElementById('result-msg').innerText = "Consultando base de datos...";
            document.getElementById('guest-info').style.display = 'none';
        }

        function showStatus(type, title, msg, name = '', num = '') {
            const card = document.getElementById('result-card');
            const icon = document.getElementById('result-icon');
            const rTitle = document.getElementById('result-title');
            const rMsg = document.getElementById('result-msg');
            const gInfo = document.getElementById('guest-info');
            
            card.style.display = 'block';
            
            if (type === 'SUCCESS') {
                card.style.borderTopColor = '#10b981';
                card.style.backgroundColor = '#f0fdf4';
                icon.innerText = "✅";
                rTitle.style.color = '#15803d';
            } else if (type === 'ALREADY') {
                card.style.borderTopColor = '#f59e0b';
                card.style.backgroundColor = '#fffbeb';
                icon.innerText = "❌";
                rTitle.style.color = '#b45309';
            } else {
                card.style.borderTopColor = '#dc2626';
                card.style.backgroundColor = '#fef2f2';
                icon.innerText = "🚨";
                rTitle.style.color = '#b91c1c';
            }

            rTitle.innerText = title;
            rMsg.innerText = msg;

            if (name) {
                gInfo.style.display = 'block';
                document.getElementById('guest-name').innerText = name;
                document.getElementById('guest-num').innerText = num ? `Código: ${num}` : '';
            } else {
                gInfo.style.display = 'none';
            }
        }

        function resetScannerView() {
            document.getElementById('result-card').style.display = 'none';
            lastResult = null;
        }

        function initScanner() {
            // Warten bis die externe JS geladen ist
            if (typeof Html5QrcodeScanner !== 'undefined') {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 15, 
                        qrbox: { width: 250, height: 250 },
                        rememberLastUsedCamera: true
                    },
                    false
                );
                html5QrcodeScanner.render(onScanSuccess);
            } else {
                setTimeout(initScanner, 200);
            }
        }

        window.addEventListener('DOMContentLoaded', initScanner);
    </script>
</body>
</html>
